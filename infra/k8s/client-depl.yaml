apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: robertm6ts/client
          env:
            - name: WDS_SOCKET_PORT
              value: "0" 
          ports:
            - containerPort: 3000