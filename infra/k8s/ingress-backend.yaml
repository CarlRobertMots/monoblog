apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-backend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: blog.local
      http:
        paths:
          - path: /posts/create 
            pathType: Prefix
            backend:
              service:
                name: posts-srv
                port:
                  number: 5000
          - path: /posts/.*/comments
            pathType: Prefix
            backend:
              service:
                name: comments-srv
                port:
                  number: 5001
          - path: /posts
            pathType: Prefix
            backend:
              service:
                name: query-srv
                port:
                  number: 5002